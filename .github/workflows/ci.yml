name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unit tests
        run: dotnet test --configuration Release --filter "Category!=Integration" --logger "trx;LogFileName=unit.trx" --results-directory "artifacts/test-results/unit"
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: artifacts/test-results/unit
        if: always()

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    services:
      docker:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compose up (ci profile)
        run: ./infra/scripts/bootstrap-compose.sh ci
      - name: Integration tests
        run: dotnet test tests/Integration/MyNewLittleBank.Tests.Integration.csproj --configuration Release --filter "Category=Integration" --logger "trx;LogFileName=integration.trx" --results-directory "artifacts/test-results/integration"
      - name: Compose down
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile ci down -v --remove-orphans
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests
          path: artifacts/test-results/integration
        if: always()

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service:
          - src/Services.Card
          - src/Services.Pix
          - src/Services.Money
          - src/Services.Heartbeats
          - src/Mock.Transactions
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.service }}/Dockerfile \
            -t mynewlittlebank:${{ matrix.service##*/ }} \
            .
