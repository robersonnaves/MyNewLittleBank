name: mynewlittlebank

services:
  postgres:
    container_name: postgres
    image: docker.io/library/postgres:16-alpine
    profiles: [ local, ci ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mynewlittlebank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bank-net

  rabbitmq:
    container_name: rabbitmq
    image: docker.io/library/rabbitmq:3.13-management
    profiles: [ local, ci ]
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bank-net

  opensearch:
    container_name: opensearch
    image: docker.io/opensearchproject/opensearch:2.15.0
    profiles: [ local, ci ]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "S3gr3d0123"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - bank-net

  jaeger:
    container_name: jaeger
    image: docker.io/jaegertracing/all-in-one:1.58
    profiles: [ local, ci ]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:16686" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bank-net

  prometheus:
    container_name: prometheus
    image: docker.io/prom/prometheus:v2.54.1
    profiles: [ local, ci ]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bank-net

  pgadmin:
    container_name: pgadmin
    image: docker.io/dpage/pgadmin4
    profiles: [ local, ci ]
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@robdevs.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bank-net
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  api:
    container_name: api
    profiles: [ local, ci ]
    build:
      context: ../
      dockerfile: src/API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - Swagger__Enabled=true
    restart: on-failure
    ports:
      - "5000:8080"
    networks:
      - bank-net

  mock-transactions:
    container_name: mock-transactions
    profiles: [ local, ci ]
    build:
      context: ../
      dockerfile: src/Mock.Transactions/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - MockTransactions__ApiBaseUrl=http://api:8080
      - MockTransactions__Seed__Enabled=true
    restart: on-failure
    networks:
      - bank-net

  services-card:
    container_name: services-card
    profiles: [ local, ci ]
    build:
      context: ../
      dockerfile: src/Services.Card/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    restart: on-failure
    networks:
      - bank-net

  services-heartbeats:
    container_name: services-heartbeats
    profiles: [ local, ci ]
    build:
      context: ../
      dockerfile: src/Services.Heartbeats/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    restart: on-failure
    networks:
      - bank-net

  services-money:
    container_name: services-money
    profiles: [ local, ci ]
    build:
      context: ../
      dockerfile: src/Services.Money/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    restart: on-failure
    networks:
      - bank-net

  services-pix:
    container_name: services-pix
    profiles: [ local, ci ]
    build:
      context: ../
      dockerfile: src/Services.Pix/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    restart: on-failure
    networks:
      - bank-net

networks:
  bank-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  opensearch_data:
  prometheus_data:
  pgadmin_data:
