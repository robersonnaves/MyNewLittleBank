server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h  # 7 dias
    compacted_block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    pool:
      max_workers: 100
      queue_depth: 10000

# Retenção de 7 dias
retention_period: 168h

# Otimizações
overrides:
  defaults:
    ingestion_burst_size_bytes: 1073741824  # 1GB
    ingestion_rate_limit_bytes: 1073741824  # 1GB

