global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Configuração de retenção
storage:
  tsdb:
    path: /prometheus
    retention.time: 7d
    retention.size: 0

# Configuração de alertas (futuro)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: []

# Regras de alertas (futuro)
# rule_files:
#   - "alert_rules.yml"

scrape_configs:
  # Auto-monitoramento do Prometheus
  - job_name: prometheus
    static_configs:
      - targets:
          - "prometheus:9090"
  
  # Métricas do OpenTelemetry Collector
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - "otel-collector:8889"
  
  # Métricas do Jaeger (opcional)
  - job_name: jaeger
    metrics_path: /metrics
    static_configs:
      - targets:
          - "jaeger:14269"

