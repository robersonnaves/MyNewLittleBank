auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  # Retenção de 7 dias (168 horas)
  retention_period: 168h
  # Limites para desenvolvimento
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_length: 721h
  max_query_parallelism: 32
  max_streams_per_user: 10000
  max_line_size: 256KB
  # Suporte a structured metadata
  allow_structured_metadata: true
  # Pattern ingestion habilitado
  pattern_ingestion_enabled: true

# Distribuidor
distributor:
  ring:
    kvstore:
      store: inmemory

# Ingester
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_retain_period: 30s
  max_transfer_retries: 0

# Querier
querier:
  query_timeout: 300s
  engine:
    timeout: 300s
    max_look_back_period: 0s

# Query Frontend
frontend:
  max_outstanding_per_tenant: 2048
  querier_idle_timeout: 30s

# Query Scheduler
query_scheduler:
  max_outstanding_requests_per_tenant: 2048

# Ruler (para regras futuras)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# Table Manager (legacy, mantido para compatibilidade)
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h

