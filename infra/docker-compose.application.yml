name: mynewlittlebank

services:
  postgres:
    container_name: postgres
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-S3gr3d0123}
      POSTGRES_DB: ${POSTGRES_DB:-mynewlittlebank}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bank-net

  rabbitmq:
    container_name: rabbitmq
    image: docker.io/library/rabbitmq:3.13-management
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bank-net

  opensearch:
    container_name: opensearch
    image: docker.io/opensearchproject/opensearch:3.4.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null" ]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - bank-net

  otel-collector:
    container_name: otel-collector
    image: docker.io/otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    user: "0:0"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=apphost:18888
    volumes:
      - ./config/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
      - "13133:13133" # health_check extension
    healthcheck:
      disable: true
    restart: on-failure
    networks:
      - bank-net

  pgadmin:
    container_name: pgadmin
    image: docker.io/dpage/pgadmin4
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@robdevs.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bank-net
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  api:
    container_name: api
    image: mynewlittlebank-api:latest
    build:
      context: ../
      dockerfile: src/API/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-S3gr3d0123}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - Swagger__Enabled=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=api
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,service.version=1.0.0
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_DOTNET_AUTO_LOGS_INCLUDE_FORMATTED_MESSAGE=true
    restart: on-failure
    ports:
      - "5001:8080"
    networks:
      - bank-net

  mock-transactions:
    container_name: mock-transactions
    image: mynewlittlebank-mock-transactions:latest
    build:
      context: ../
      dockerfile: src/Mock.Transactions/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - MockTransactions__ApiBaseUrl=http://api:8080
      - MockTransactions__Seed__Enabled=true
      - MockTransactions__TransactionType=all
      - MockTransactions__MessagesPerSecond=2
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=mock-transactions
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local
    restart: on-failure
    networks:
      - bank-net

  services-card:
    container_name: services-card
    image: mynewlittlebank-services-card:latest
    build:
      context: ../
      dockerfile: src/Services.Card/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      notification-receiver:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-S3gr3d0123}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__Queue=queue.card.transactions
      - RabbitMQ__RoutingKey=card.transactions
      - Notifications__BaseUrl=http://notification-receiver:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=services-card
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local
    restart: on-failure
    networks:
      - bank-net

  services-heartbeats:
    container_name: services-heartbeats
    image: mynewlittlebank-services-heartbeats:latest
    build:
      context: ../
      dockerfile: src/Services.Heartbeats/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-S3gr3d0123}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=services-heartbeats
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local
    restart: on-failure
    networks:
      - bank-net

  services-money:
    container_name: services-money
    image: mynewlittlebank-services-money:latest
    build:
      context: ../
      dockerfile: src/Services.Money/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      notification-receiver:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-S3gr3d0123}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__Queue=queue.money.transactions
      - RabbitMQ__RoutingKey=money.transactions
      - Notifications__BaseUrl=http://notification-receiver:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=services-money
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local
    restart: on-failure
    networks:
      - bank-net

  services-pix:
    container_name: services-pix
    image: mynewlittlebank-services-pix:latest
    build:
      context: ../
      dockerfile: src/Services.Pix/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
      notification-receiver:
        condition: service_started
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-mynewlittlebank};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-S3gr3d0123}
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__Queue=queue.pix.transactions
      - RabbitMQ__RoutingKey=pix.transactions
      - Notifications__BaseUrl=http://notification-receiver:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=services-pix
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local
    restart: on-failure
    networks:
      - bank-net

  notification-receiver:
    container_name: notification-receiver
    build:
      context: ../workers/notification-receiver-go
      dockerfile: Dockerfile
    # Specify the image format to avoid HEALTHCHECK warnings with Podman
    image: notification-receiver:latest
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      - PORT=8080
      - NOTIFICATIONS_DIR=/data/notifications
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=notification-receiver
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=local,service.version=1.0.0
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_DOTNET_AUTO_LOGS_INCLUDE_FORMATTED_MESSAGE=true
    ports:
      - "8081:8080"
    volumes:
      - notification_data:/data/notifications
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: on-failure
    networks:
      - bank-net

  apphost:
    container_name: apphost
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    depends_on:
      - api
      - services-card
      - services-money
      - services-pix
      - services-heartbeats
      - mock-transactions
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_DASHBOARD_OTLP_ENDPOINT_URL=http://+:18888
      - ASPIRE_ALLOW_UNSECURED_TRANSPORT=true
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "18888:18888"
      - "15000:8080"
    volumes:
      - aspire_data_protection:/home/app/.aspnet/DataProtection-Keys
    networks:
      - bank-net

networks:
  bank-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  opensearch_data:
  pgadmin_data:
  notification_data:
  aspire_data_protection:
