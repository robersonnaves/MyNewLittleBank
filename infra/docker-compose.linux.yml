# Docker Compose override for Linux systems with SELinux
# This file is automatically applied on Linux by the startup scripts
#
# Usage:
#   Automatically detected on Linux, or manually:
#   docker-compose -f docker-compose.yml -f docker-compose.linux.yml up

services:
  otel-collector:
    volumes:
      # Override with SELinux context for private use
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro,Z

  prometheus:
    volumes:
      # Override with SELinux context for shared use
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:z
      - prometheus_data:/prometheus

# Volumes must be redeclared (Docker Compose requirement)
volumes:
  prometheus_data:
